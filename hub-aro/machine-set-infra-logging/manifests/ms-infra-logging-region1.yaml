apiVersion: machine.openshift.io/v1beta1
kind: MachineSet
metadata:
  name: '{{ (lookup "config.openshift.io/v1" "Infrastructure" "" "cluster").status.infrastructureName }}-infra-logging-z1'
  namespace: openshift-machine-api
  labels:
    machine.openshift.io/cluster-api-cluster: '{{ (lookup "config.openshift.io/v1" "Infrastructure" "" "cluster").status.infrastructureName }}'
    machine.openshift.io/cluster-api-machine-role: infra
    machine.openshift.io/cluster-api-machine-type: infra
spec:
  replicas: 1
  selector:
    matchLabels:
      machine.openshift.io/cluster-api-cluster: '{{ (lookup "config.openshift.io/v1" "Infrastructure" "" "cluster").status.infrastructureName }}'
      machine.openshift.io/cluster-api-machineset: '{{ (lookup "config.openshift.io/v1" "Infrastructure" "" "cluster").status.infrastructureName }}-infra-logging-z1'
  template:
    metadata:
      labels:
        machine.openshift.io/cluster-api-cluster: '{{ (lookup "config.openshift.io/v1" "Infrastructure" "" "cluster").status.infrastructureName }}'
        machine.openshift.io/cluster-api-machine-role: infra
        machine.openshift.io/cluster-api-machine-type: infra
        machine.openshift.io/cluster-api-machineset: '{{ (lookup "config.openshift.io/v1" "Infrastructure" "" "cluster").status.infrastructureName }}-infra-logging-z1'
    spec:
      metadata:
        labels:
          env: logging
          node-role.kubernetes.io: infra
          node-role.kubernetes.io/infra: ''
      providerSpec:
        value:
          apiVersion: machine.openshift.io/v1beta1
          kind: AzureMachineProviderSpec
          # ---- descoberto do cluster ----
          resourceGroup: '{{ (lookup "config.openshift.io/v1" "Infrastructure" "" "cluster").status.platformStatus.azure.resourceGroupName }}'
          publicLoadBalancer: '{{ (lookup "config.openshift.io/v1" "Infrastructure" "" "cluster").status.infrastructureName }}'
          location: '{{ (index (lookup "machine.openshift.io/v1beta1" "MachineSet" "openshift-machine-api" "" "machine.openshift.io/cluster-api-machine-role=worker").items 0).spec.template.spec.providerSpec.value.location }}'
          networkResourceGroup: '{{ (index (lookup "machine.openshift.io/v1beta1" "MachineSet" "openshift-machine-api" "" "machine.openshift.io/cluster-api-machine-role=worker").items 0).spec.template.spec.providerSpec.value.networkResourceGroup }}'
          vnet: '{{ (index (lookup "machine.openshift.io/v1beta1" "MachineSet" "openshift-machine-api" "" "machine.openshift.io/cluster-api-machine-role=worker").items 0).spec.template.spec.providerSpec.value.vne
