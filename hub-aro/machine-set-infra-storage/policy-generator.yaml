apiVersion: policy.open-cluster-management.io/v1
kind: PolicyGenerator

metadata:
  name: machine-set-infra-storage-policy-generator

policyDefaults:
  remediationAction: enforce
  namespace: hub-cluster-infra
  placement:
    placementName: hub-cluster-infra

placementBindingDefaults:
  name: binding-machine-set-infra-storage

policies:
  - name: machine-set-infra-storage
    manifests:
      - path: manifests