apiVersion: machine.openshift.io/v1beta1
kind: MachineSet
metadata:
  name: '{{ (lookup "config.openshift.io/v1" "Infrastructure" "" "cluster").status.infrastructureName }}-worker-z1'
  namespace: openshift-machine-api
  labels:
    machine.openshift.io/cluster-api-cluster: '{{ (lookup "config.openshift.io/v1" "Infrastructure" "" "cluster").status.infrastructureName }}'
    machine.openshift.io/cluster-api-machine-role: worker
    machine.openshift.io/cluster-api-machine-type: worker
spec:
  replicas: 0
  selector:
    matchLabels:
      machine.openshift.io/cluster-api-cluster: '{{ (lookup "config.openshift.io/v1" "Infrastructure" "" "cluster").status.infrastructureName }}'
      machine.openshift.io/cluster-api-machineset: '{{ (lookup "config.openshift.io/v1" "Infrastructure" "" "cluster").status.infrastructureName }}-worker-z1'
  template:
    metadata:
      labels:
        machine.openshift.io/cluster-api-cluster: '{{ (lookup "config.openshift.io/v1" "Infrastructure" "" "cluster").status.infrastructureName }}'
        machine.openshift.io/cluster-api-machine-role: worker
        machine.openshift.io/cluster-api-machine-type: worker
        machine.openshift.io/cluster-api-machineset: '{{ (lookup "config.openshift.io/v1" "Infrastructure" "" "cluster").status.infrastructureName }}-worker-z1'
    spec:
      metadata:
        labels:
          node-role.kubernetes.io/worker: ''
      providerSpec:
        value:
          apiVersion: machine.openshift.io/v1beta1
          kind: AzureMachineProviderSpec
          # ---- descoberto do cluster ----
          resourceGroup: '{{ (lookup "config.openshift.io/v1" "Infrastructure" "" "cluster").status.platformStatus.azure.resourceGroupName }}'
          publicLoadBalancer: '{{ (lookup "config.openshift.io/v1" "Infrastructure" "" "cluster").status.infrastructureName }}'
          location: '{{ (index (lookup "machine.openshift.io/v1beta1" "Machine" "openshift-machine-api" "" "machine.openshift.io/cluster-api-machine-role=master").items 0).spec.providerSpec.value.location }}'
          networkResourceGroup: '{{ (index (lookup "machine.openshift.io/v1beta1" "Machine" "openshift-machine-api" "" "machine.openshift.io/cluster-api-machine-role=master").items 0).spec.providerSpec.value.networkResourceGroup }}'
          vnet: '{{ (index (lookup "machine.openshift.io/v1beta1" "Machine" "openshift-machine-api" "" "machine.openshift.io/cluster-api-machine-role=master").items 0).spec.providerSpec.value.vnet }}'
          subnet: worker-subnet
          # ---- fixo da organização ----
          zone: '1'
          vmSize: Standard_D16s_v3
          image:
            publisher: azureopenshift
            offer: aro4
            sku: 420-v2
            type: MarketplaceNoPlan
            version: 9.6.20251015
          osDisk:
            diskSizeGB: 128
            managedDisk:
              storageAccountType: Premium_LRS
            osType: Linux
          acceleratedNetworking: true
          publicIP: false
          diagnostics:
            boot:
              storageAccountType: AzureManaged
          userDataSecret:
            name: worker-user-data
          credentialsSecret:
            name: azure-cloud-credentials
            namespace: openshift-machine-api
