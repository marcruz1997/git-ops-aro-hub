apiVersion: v1
kind: Secret
metadata:
  name: logging-loki-s3
  namespace: openshift-logging
type: Opaque
data:
  access_key_id: '{{ (lookup "v1" "Secret" "openshift-logging" "loki").data.AWS_ACCESS_KEY_ID }}'
  access_key_secret: '{{ (lookup "v1" "Secret" "openshift-logging" "loki").data.AWS_SECRET_ACCESS_KEY }}'
  bucketnames: '{{ (lookup "v1" "ConfigMap" "openshift-logging" "loki").data.BUCKET_NAME | b64enc }}'
  endpoint: '{{ printf "https://%s:%s" (lookup "v1" "ConfigMap" "openshift-logging" "loki").data.BUCKET_HOST (lookup "v1" "ConfigMap" "openshift-logging" "loki").data.BUCKET_PORT | b64enc }}'
