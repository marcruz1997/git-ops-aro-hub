apiVersion: observability.openshift.io/v1
kind: ClusterLogForwarder
metadata:
  name: logging
  namespace: openshift-logging
spec:
  collector:
    tolerations:
      - operator: Exists
  filters:
    - name: multiline
      type: detectMultilineException
  managementState: Managed
  outputs:
    - lokiStack:
        authentication:
          token:
            from: serviceAccount
        target:
          name: logging-loki
          namespace: openshift-logging
      name: default-lokistack
      tls:
        ca:
          configMapName: openshift-service-ca.crt
          key: service-ca.crt
      type: lokiStack
  pipelines:
    - filterRefs:
        - multiline
      inputRefs:
        - application
      name: apps
      outputRefs:
        - default-lokistack
    - filterRefs:
        - multiline
      inputRefs:
        - infrastructure
      name: infrastructure-logs
      outputRefs:
        - default-lokistack
    - filterRefs:
        - multiline
      inputRefs:
        - audit
      name: audit-logs
      outputRefs:
        - default-lokistack
  serviceAccount:
    name: logcollector