apiVersion: policy.open-cluster-management.io/v1
kind: PolicyGenerator

metadata:
  name: ingress-controler-default-policy-generator

policyDefaults:
  remediationAction: enforce
  namespace: hub-cluster-infra
  placement:
    placementName: hub-cluster-infra

placementBindingDefaults:
  name: binding-ingress-controler-default

policies:
  - name: ingress-controler-default
    manifests:
      - path: manifests